# TL;DR: 
#+-----------------+------------------------------------+--------------------------+
#| URL	           |  Carpeta del servidor	            |       Què és             |
#+-----------------+------------------------------------+--------------------------+
#| /	           |   /var/www/html	                |     Web principal        | 
#| /producto3      |   /var/www/laravel/reparaya/public |	 Aplicación Laravel    |
#| /diagnostic     |   /var/www/diagnostic	            |     Página de pruebas    |
#+-----------------+------------------------------------+--------------------------+

# Definición de un host virtual Apache que escucha el puerto 80 (HTTP, sin cifrar). 
# El "*" quiere decir que acepta peticiones de cualquier IP/nombre de la máquina.

<VirtualHost *:80>
    # Carpeta raíz de la web: lo que haya dentro de /var/www/html se sirve en "/"
    # p.ej.: http://localhost/ muestra el contenido de esta carpeta
    DocumentRoot /var/www/html

    # Permisos y opciones de la carpeta raíz
    <Directory /var/www/html>

        # Permite que los ficheros .htaccess de esta carpeta sobreescriban la configuración de Apache (p. ej.: reglas de reescritura de URL)
        AllowOverride All

        # Permite el acceso a cualquier visitante, sin restricciones de IP ni autenticación
        Require all granted
    </Directory>

    # --- Aplicación Laravel (Producto 3) ---
    # Hace que la URL /producto3 apunte a la carpeta "public" de Laravel (http://localhost/producto3 -> /var/www/laravel/reparaya/public).
    # Solo se expone "public": el resto del proyect (app, .env, vendor...) queda fuera del alcance del navegador, lo que lo hace más seguro.
    Alias /producto3 /var/www/laravel/reparaya/public
    <Directory /var/www/laravel/reparaya/public>

        # Necesario para que Laravel pueda leer su .htaccess en public/, que redirige todas las rutas hacia index.php (requiere mod_rewrite activado).
        AllowOverride All

        # Acceso público a la aplicación
        Require all granted
    </Directory>

    # --- Página de diagnóstico ---
    # Hace que la URL /diagnostic sirva el contenido de /var/www/diagnostic (útil para comprobar que PHP, la base de datos, etc. funcionan)
    Alias /diagnostic /var/www/diagnostic
    <Directory /var/www/diagnostic>
        
        # Permite usar .htaccess en esta carpeta
        AllowOverride All

        # Acceso público
        Require all granted
    </Directory>

    # Fichero donde se registran los errores de Apache
    # {APACHE_LOG_DIR} es una variable de entorno (normalmente /var/log/apache2)
    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Fichero donde se registra cada petición recibida; el formato "combined" incluye la IP, fecha, petición, código de respuesta, navegador y página de procedencia.
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>