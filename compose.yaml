services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: reparaya_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./www:/var/www/html                             # WordPress (raíz)
      - ./producto2:/var/www/producto2                  # App PHP nativa
      - ./laravel/reparaya:/var/www/laravel/reparaya    # Laravel (producto3)
      - ./diagnostic:/var/www/diagnostic                # Página de diagnóstico
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GROUP_CODE: ${GROUP_CODE}
      STUDENT_NAME: ${STUDENT_NAME}
      APP_ENV: ${APP_ENV}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reparaya_net

  db:
    image: ${DB_IMAGE}
    container_name: reparaya_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - reparaya_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: reparaya_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reparaya_net

networks:
  reparaya_net:
    driver: bridge

volumes:
  db_data: